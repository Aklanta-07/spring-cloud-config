resilience4j.circuitbreaker.instances.productService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.productService.sliding-window-size=4
resilience4j.circuitbreaker.instances.productService.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.productService.wait-duration-in-open-state=10s
resilience4j.timelimiter.instances.productService.timeout-duration=5s
resilience4j.timelimiter.instances.productService.cancel-running-future=true

#retry
resilience4j.retry.instances.productService.max-attempts=3
resilience4j.retry.instances.productService.wait-duration=500ms